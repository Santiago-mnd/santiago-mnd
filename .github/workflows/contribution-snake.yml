name: Generate contribution snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: Santiago-mnd
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=%2333283D&color_dots=%23F5F1F8,%23B9A5CF,%23B7799A,%2376558F,%23593D6B
      - uses: EndBug/add-and-commit@v9
        with:
          add: dist/github-contribution-grid-snake.svg
          default_author: github_actions
          message: "chore: refresh contribution snake"
